<svg width="1120" height="260" viewBox="0 0 1120 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">de-Franhash Technologies logo</title>
  <desc id="desc">Blue hashtag icon with de-Franhash Technologies text</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27B1FF"/>
      <stop offset="100%" stop-color="#1C6ED8"/>
    </linearGradient>
  </defs>

  <g transform="translate(20,14)" stroke="url(#g)" stroke-linecap="round" stroke-width="26">
    <line x1="80" y1="30" x2="35" y2="214"/>
    <line x1="165" y1="30" x2="120" y2="214"/>
    <line x1="8" y1="90" x2="200" y2="90"/>
    <line x1="0" y1="160" x2="192" y2="160"/>
  </g>

  <g transform="translate(270,30)">
    <text x="0" y="118" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-1.5">
      <tspan>de-Franhash</tspan>
    </text>
    <text x="0" y="208" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="9">
      <tspan>TECHNOLOGIES</tspan>
    </text>
  </g>
</svg>
